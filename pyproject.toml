[project]
name = "joystick-diagrams-dcs-world-plugin"
version = "2.0.0"
description = "DCS World parser plugin for Joystick Diagrams"
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [{ name = "Robert Cox" }]

# Runtime dependency the plugin imports. NOTE: installed plugins do not pip-install
# their own deps — the host must bundle `ply` so the plugin can import it at runtime.
dependencies = [
    "ply>=3.11,<4",
]

[project.urls]
Homepage = "https://www.joystick-diagrams.com"
Repository = "https://github.com/Rexeh/joystick-diagrams-dcs-world-plugin"
Host = "https://github.com/Rexeh/joystick-diagrams"

[project.optional-dependencies]
# Dev/test only. The host package provides the `joystick_diagrams` SDK the plugin imports
# (joystick_diagrams.input.*, plugin_interface, plugin_settings) plus `cryptography` for signing.
dev = [
    "pytest>=7.2.0,<8",
    "pytest-cov>=4.0.0,<5",
    "ruff>=0.15.0",
    "joystick-diagrams @ git+https://github.com/Rexeh/joystick-diagrams@master",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcs_world_plugin"]

[tool.pytest.ini_options]
# Tests import the plugin as a top-level package and read fixtures relative to the repo root.
pythonpath = ["."]
testpaths = ["tests"]
